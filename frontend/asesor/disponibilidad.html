<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi disponibilidad - Asesorías CETI</title>
  <link rel="stylesheet" href="disponibilidad.css">
</head>
<body>

  <!-- BARRA DE ARRIBA -->
  <header class="navbar">
    <div class="marca">
      <span class="logo">CT</span>
      <span>Asesorías CETI</span>
    </div>
    <div class="enlaces">
      <a href="asesor.html">Inicio</a>
      <a href="mis-materias.html">Mis materias</a>
      <a href="../perfil/perfil.html">Mi perfil</a>
      <button id="btnSalir" class="btn-salir">Salir</button>
    </div>
  </header>

  <main class="contenido">

    <h2>Mi disponibilidad semanal</h2>
    <p class="ayuda">Agrega los horarios en los que puedes dar asesorías. Los alumnos solo podrán agendar en estos bloques.</p>

    <!-- RESUMEN -->
    <section class="resumen">
      <div class="dato">
        <span class="numero" id="totalBloques">0</span>
        <span>bloques publicados</span>
      </div>
      <div class="dato">
        <span class="numero" id="totalHoras">0 h</span>
        <span>de disponibilidad a la semana</span>
      </div>
    </section>

    <!-- FORMULARIO PARA AGREGAR O EDITAR UN BLOQUE -->
    <section class="formulario">
      <h3 id="tituloFormulario">Agregar un bloque</h3>

      <div class="fila">
        <div class="campo">
          <label for="selectDia">Día</label>
          <select id="selectDia">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
          </select>
        </div>

        <div class="campo">
          <label for="inputInicio">Hora de inicio</label>
          <input type="time" id="inputInicio" min="07:00" max="21:00">
        </div>

        <div class="campo">
          <label for="inputFin">Hora de fin</label>
          <input type="time" id="inputFin" min="07:00" max="21:00">
        </div>
      </div>

      <p class="error" id="errorFormulario"></p>

      <button id="btnAgregar" class="btn btn-naranja">Agregar bloque</button>
      <button id="btnCancelarEdicion" class="btn btn-borde oculto">Cancelar edición</button>
    </section>

    <!-- VISTA SEMANAL -->
    <section>
      <div class="encabezado-semana">
        <h3>Mi semana</h3>
        <button id="btnLimpiar" class="btn btn-peligro">Borrar todo</button>
      </div>
      <div id="semana" class="semana"></div>
    </section>

  </main>

  <!-- MENSAJE EMERGENTE -->
  <div id="mensaje" class="mensaje"></div>

  <script src="../compartido/sesion.js"></script>
  <script src="disponibilidad.js"></script>
</body>
</html>
