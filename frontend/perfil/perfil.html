<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil - Asesorías CETI</title>
  <link rel="stylesheet" href="perfil.css">
</head>
<body>

  <!-- BARRA DE ARRIBA -->
  <header class="navbar">
    <div class="marca">
      <span class="logo">CT</span>
      <span>Asesorías CETI</span>
    </div>
    <div class="enlaces">
       <a href="../materias/materias.html" id="enlaceVolver">← Volver</a>
      <button id="btnSalir" class="btn-salir">Salir</button>
    </div>
  </header>

  <main class="contenido">

    <!-- FOTO Y DATOS DE ARRIBA -->
    <section class="cabecera">
      <div class="foto" id="foto"></div>
      <input type="file" id="archivoFoto" accept="image/*" hidden>
      <div>
        <h2 id="textoNombre"></h2>
        <p id="textoRol"></p>
        <button id="btnCambiarFoto" class="btn btn-borde">Cambiar foto</button>
        <button id="btnQuitarFoto" class="btn btn-borde">Quitar foto</button>
      </div>
    </section>

    <!-- DATOS DE LA CUENTA -->
    <section>
      <h3 class="titulo">Datos de la cuenta</h3>

      <label for="inputNombre">Nombre completo</label>
      <input type="text" id="inputNombre">
      <p class="error" id="errorNombre">El nombre debe tener al menos 3 letras</p>

      <label for="inputCorreo">Correo institucional</label>
      <input type="text" id="inputCorreo" disabled>

      <button id="btnGuardar" class="btn btn-naranja">Guardar cambios</button>
    </section>

    <!-- DISPONIBILIDAD (solo se ve si el rol es asesor) -->
    <section id="seccionDisponibilidad" class="oculto">
      <h3 class="titulo">Mi disponibilidad como asesor</h3>
      <p class="ayuda">Da clic en los bloques para marcar o quitar tus horarios libres</p>

      <table class="horario">
        <tr>
          <th></th><th>L</th><th>M</th><th>M</th><th>J</th><th>V</th>
        </tr>
        <tr>
          <td>9–11</td>
          <td class="bloque"></td><td class="bloque"></td><td class="bloque"></td><td class="bloque"></td><td class="bloque"></td>
        </tr>
        <tr>
          <td>11–13</td>
          <td class="bloque"></td><td class="bloque"></td><td class="bloque"></td><td class="bloque"></td><td class="bloque"></td>
        </tr>
        <tr>
          <td>16–18</td>
          <td class="bloque"></td><td class="bloque"></td><td class="bloque"></td><td class="bloque"></td><td class="bloque"></td>
        </tr>
      </table>

      <button id="btnGuardarHorario" class="btn btn-naranja">Guardar disponibilidad</button>
    </section>

  </main>

  <!-- MENSAJE EMERGENTE -->
  <div id="mensaje" class="mensaje"></div>
  
  <script src="../compartido/sesion.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
